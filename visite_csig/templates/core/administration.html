{% extends 'base.html' %}
{% block content %}
<div class="page-title-bar">
    <div>
        <h2><i class="bi bi-gear"></i> Administration</h2>
        <div class="subtitle">Paramètres et référentiels du système</div>
    </div>
</div>

<div class="row">
    <div class="col-md-4 mb-3">
        <div class="card-section">
            <div class="card-header-custom"><i class="bi bi-tags"></i> Motifs</div>
            <div class="card-body">
                <a href="{% url 'core:admin_motifs' %}" class="btn btn-primary w-100">
                    Gérer les motifs
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card-section">
            <div class="card-header-custom"><i class="bi bi-people"></i> Correspondants</div>
            <div class="card-body">
                <a href="{% url 'core:admin_correspondants' %}" class="btn btn-primary w-100">
                    Gérer les correspondants
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card-section">
            <div class="card-header-custom"><i class="bi bi-calendar2-week"></i> Créneaux</div>
            <div class="card-body">
                <a href="{% url 'core:admin_creneaux' %}" class="btn btn-primary w-100">
                    Gérer les créneaux
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card-section">
            <div class="card-header-custom"><i class="bi bi-people-fill"></i> Utilisateurs</div>
            <div class="card-body">
                <a href="{% url 'core:admin_utilisateurs' %}" class="btn btn-primary w-100">
                    Gérer les utilisateurs
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
