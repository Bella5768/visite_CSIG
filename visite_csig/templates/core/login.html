<!DOCTYPE html>
<html lang="fr">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - {{ APP_NAME }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #e8ecf4 0%, #d4dbe8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            padding: 22px 24px;
            text-align: center;
            color: #fff;
        }
        .login-header .ministry-logo {
            width: min(120px, 55%);
            height: auto;
            display: block;
            margin: 0 auto 12px;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
        }
        .login-header .icon-circle {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .login-header .icon-circle i {
            font-size: 24px;
        }
        .login-header h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .login-header p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
        }
        .login-body {
            padding: 24px 26px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border: 2px solid #e0e5ec;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .input-wrapper:focus-within {
            border-color: #4361ee;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }
        .input-wrapper .input-icon {
            padding: 0 15px;
            color: #9ca3af;
        }
        .input-wrapper input {
            flex: 1;
            border: none;
            padding: 13px 15px 13px 0;
            font-size: 15px;
            outline: none;
            background: transparent;
        }
        .input-wrapper .toggle-password {
            padding: 0 15px;
            color: #9ca3af;
            cursor: pointer;
            background: none;
            border: none;
        }
        .input-wrapper .toggle-password:hover {
            color: #4361ee;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(67, 97, 238, 0.4);
        }
        .login-footer {
            text-align: center;
            padding: 14px 26px 18px;
            color: #6b7280;
            font-size: 13px;
        }
        .login-footer i {
            margin-right: 5px;
        }
        .alert {
            margin-bottom: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{% static 'images/mena-etfp-transparent.png' %}" alt="Logo MENA-ETFP" class="ministry-logo">
                <div class="icon-circle">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h1>Accès sécurisé</h1>
                <p>Système de Gestion des Visites<br>MENA-ETFP</p>
            </div>
            <div class="login-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="bi bi-person"></i></span>
                            <input type="text" name="nom_utilisateur" placeholder="Nom d'utilisateur" required autofocus>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="bi bi-lock"></i></span>
                            <input type="password" name="mot_de_passe" id="password" placeholder="Mot de passe" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="bi bi-box-arrow-in-right"></i> Se connecter
                    </button>
                </form>
            </div>
            <div class="login-footer">
                <p><i class="bi bi-info-circle"></i> Accès réservé au personnel autorisé</p>
                <p>Version {{ APP_VERSION }} - &copy; 2026</p>
            </div>
        </div>
    </div>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
