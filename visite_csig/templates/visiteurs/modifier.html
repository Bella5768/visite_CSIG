{% extends 'base.html' %}
{% block content %}
<div class="row mb-4"><div class="col-12"><h2><i class="bi bi-pencil"></i> Modifier visiteur</h2></div></div>
<div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
        <div class="row mb-3">
            <div class="col-md-6"><label class="form-label">Nom *</label><input type="text" name="nom" class="form-control" value="{{ visiteur.nom }}" required></div>
            <div class="col-md-6"><label class="form-label">Prénoms *</label><input type="text" name="prenoms" class="form-control" value="{{ visiteur.prenoms }}" required></div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6"><label class="form-label">Type d'identité</label><select name="type_identite" class="form-select"><option value="">-- Sélectionner --</option>{% for value, label in types_identite %}<option value="{{ value }}" {% if visiteur.type_identite == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
            <div class="col-md-6"><label class="form-label">Numéro d'identité</label><input type="text" name="numero_identite" class="form-control" value="{{ visiteur.numero_identite|default:'' }}"></div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6"><label class="form-label">Téléphone</label><input type="text" name="telephone" class="form-control" value="{{ visiteur.telephone }}"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ visiteur.email }}"></div>
        </div>
        <div class="mb-3"><label class="form-label">Adresse</label><textarea name="adresse" class="form-control" rows="2">{{ visiteur.adresse }}</textarea></div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Enregistrer</button><a href="{% url 'visiteurs:index' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div></div>
{% endblock %}
