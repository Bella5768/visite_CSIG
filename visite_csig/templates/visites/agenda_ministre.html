{% extends 'base.html' %}
{% block content %}
<div class="page-title-bar">
    <div>
        <h2><i class="bi bi-calendar2-week"></i> Agenda du Ministre</h2>
        <div class="subtitle">Calendrier des audiences (MENA-ETFP)</div>
    </div>
</div>

<div class="card-section">
    <div class="card-body">
        <div id="calendar" style="min-height: 700px;"></div>
        <div id="events-debug" class="mt-3" style="display:none;"></div>
    </div>
</div>

<div class="modal fade" id="agendaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header agenda-modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2" id="agendaModalTitle">
          <span class="agenda-modal-icon"><i class="bi bi-calendar2-event"></i></span>
          <span>Détails</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body agenda-modal-body" id="agendaModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<style>
  .fc a { text-decoration: none; }
  .fc .fc-event,
  .fc .fc-event .fc-event-title,
  .fc .fc-event .fc-event-time,
  .fc .fc-event a { color: #fff !important; }
  .fc .fc-daygrid-event { display: block; }
  .fc .fc-event-title { display: inline !important; font-size: 12px !important; white-space: normal; }

  #calendar {
    background: #ffffff;
    border: 1px solid rgba(16, 68, 128, 0.12);
    border-radius: 14px;
    padding: 14px;
  }

  .fc .fc-toolbar-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: #0f172a;
  }

  .fc .fc-toolbar.fc-header-toolbar {
    margin-bottom: 12px;
    gap: 10px;
  }

  .fc .fc-button {
    border-radius: 10px;
    padding: 8px 12px;
    border: 1px solid rgba(16, 68, 128, 0.22) !important;
    background: #ffffff !important;
    color: var(--primary-blue) !important;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-size: 12px;
  }

  .fc .fc-button:hover {
    background: rgba(16, 68, 128, 0.05) !important;
    border-color: rgba(16, 68, 128, 0.35) !important;
  }

  .fc .fc-button:focus,
  .fc .fc-button:active,
  .fc .fc-button.fc-button-active {
    background: var(--primary-blue) !important;
    color: #ffffff !important;
    border-color: var(--primary-blue) !important;
    box-shadow: 0 8px 18px rgba(16, 68, 128, 0.25) !important;
  }

  .fc .fc-col-header-cell {
    background: rgba(16, 68, 128, 0.06);
  }

  .fc .fc-col-header-cell-cushion {
    padding: 10px 6px;
    font-weight: 700;
    color: #0f2f57;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 12px;
  }

  .fc .fc-timegrid-axis-cushion,
  .fc .fc-timegrid-slot-label-cushion {
    color: #475569;
    font-weight: 600;
  }

  .fc .fc-scrollgrid {
    border: 1px solid rgba(16, 68, 128, 0.12) !important;
    border-radius: 12px;
    overflow: hidden;
  }

  .fc .fc-daygrid-day-number {
    padding: 10px;
    color: #0f172a;
    font-weight: 700;
  }

  .fc .fc-day-today {
    background: rgba(16, 68, 128, 0.08) !important;
  }

  .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
    background: rgba(16, 68, 128, 0.10);
    border-radius: 10px;
    color: #0f2f57;
  }

  .fc .fc-now-indicator-line {
    border-color: #ef4444;
    border-width: 2px;
  }

  .fc .fc-event {
    border-radius: 10px;
    padding: 3px 6px;
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }

  .fc .fc-event:focus,
  .fc .fc-event:active {
    outline: 2px solid rgba(16, 68, 128, 0.35);
    outline-offset: 2px;
  }

  .fc .fc-event:hover {
    filter: brightness(0.98);
    transform: translateY(-1px);
    transition: all 120ms ease;
  }

  .fc .fc-daygrid-event-harness {
    margin: 2px 2px;
  }

  .fc .fc-timegrid-event {
    padding: 6px 8px;
  }

  #events-debug {
    background: #f8fafc;
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 12px;
    padding: 12px;
    color: #0f172a;
  }

  .agenda-modal-header {
    background: linear-gradient(135deg, rgba(13, 58, 110, 0.10) 0%, rgba(16, 68, 128, 0.08) 55%, rgba(21, 101, 168, 0.10) 100%);
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
  }

  .agenda-modal-icon {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #0d3a6e;
    color: #ffffff;
    box-shadow: 0 10px 24px rgba(16, 68, 128, 0.20);
  }

  .agenda-modal-body {
    background: #f1f5f9;
  }

  .agenda-modal-card {
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
    overflow: hidden;
  }

  .agenda-modal-card .card-head {
    padding: 14px 16px;
    background: #f8fafc;
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .agenda-modal-card .card-title {
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.2px;
    color: #0f172a;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .agenda-modal-card .card-title i {
    color: #0d3a6e;
    font-size: 16px;
  }

  .agenda-modal-card .card-body-in {
    padding: 16px;
  }

  .agenda-kv {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 10px 14px;
    font-size: 13px;
  }

  .agenda-kv .k {
    color: #64748b;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .agenda-kv .k i {
    color: rgba(16, 68, 128, 0.85);
  }

  .agenda-kv .v {
    color: #0f172a;
    font-weight: 700;
  }

  .agenda-desc {
    background: #ffffff;
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
    padding: 16px;
  }

  .agenda-desc .title {
    font-weight: 900;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .agenda-desc .title i {
    color: #0d3a6e;
  }

  .agenda-desc .text {
    color: #475569;
    font-weight: 600;
    white-space: pre-wrap;
    margin: 0;
  }

  @media (max-width: 576px) {
    .agenda-kv { grid-template-columns: 1fr; }
  }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function showAgendaModal(title, htmlBody) {
        var titleEl = document.getElementById('agendaModalTitle');
        var bodyEl = document.getElementById('agendaModalBody');
        if (titleEl) titleEl.textContent = title || 'Détails';
        if (bodyEl) bodyEl.innerHTML = htmlBody || '';
        try {
            var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('agendaModal'));
            modal.show();
        } catch (e) {
            alert(title + "\n\n" + (bodyEl ? bodyEl.textContent : ''));
        }
    }

    function renderEventDetails(event) {
        var p = event.extendedProps || {};
        var desc = (p.description || '').trim();
        var lines = [
            '<div class="row g-3">',
            '  <div class="col-md-6">',
            '    <div class="agenda-modal-card">',
            '      <div class="card-head">',
            '        <p class="card-title"><i class="bi bi-bookmark-star"></i> Rendez-vous</p>',
            '      </div>',
            '      <div class="card-body-in">',
            '        <div class="agenda-kv">',
            '          <div class="k"><i class="bi bi-card-text"></i> Sujet</div><div class="v">' + escapeHtml(p.sujet || event.title) + '</div>',
            '          <div class="k"><i class="bi bi-tag"></i> Motif</div><div class="v">' + escapeHtml(p.motif || '-') + '</div>',
            '          <div class="k"><i class="bi bi-calendar3"></i> Date</div><div class="v">' + escapeHtml(p.date || '-') + '</div>',
            '          <div class="k"><i class="bi bi-clock"></i> Heure</div><div class="v">' + escapeHtml((p.heure_debut || '') + ' - ' + (p.heure_fin || '')) + '</div>',
            '          <div class="k"><i class="bi bi-check2-circle"></i> Statut</div><div class="v">' + escapeHtml(p.statut || '-') + '</div>',
            '        </div>',
            '      </div>',
            '    </div>',
            '  </div>',
            '  <div class="col-md-6">',
            '    <div class="agenda-modal-card">',
            '      <div class="card-head">',
            '        <p class="card-title"><i class="bi bi-person"></i> Demandeur</p>',
            '      </div>',
            '      <div class="card-body-in">',
            '        <div class="agenda-kv">',
            '          <div class="k"><i class="bi bi-person-badge"></i> Nom</div><div class="v">' + escapeHtml(p.visiteur || '-') + '</div>',
            '          <div class="k"><i class="bi bi-telephone"></i> Téléphone</div><div class="v">' + escapeHtml(p.telephone || '-') + '</div>',
            '          <div class="k"><i class="bi bi-envelope"></i> Email</div><div class="v">' + escapeHtml(p.email || '-') + '</div>',
            '          <div class="k"><i class="bi bi-building"></i> Correspondant</div><div class="v">' + escapeHtml(p.correspondant || '-') + '</div>',
            '        </div>',
            '      </div>',
            '    </div>',
            '  </div>',
            '</div>'
        ];

        if (desc) {
            lines.push(
                '<div class="mt-3 agenda-desc">'
                + '<div class="title"><i class="bi bi-chat-left-text"></i> Description</div>'
                + '<p class="text">' + escapeHtml(desc) + '</p>'
                + '</div>'
            );
        }
        return lines.join('');
    }

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        locale: 'fr',
        eventDisplay: 'block',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        navLinks: true,
        nowIndicator: true,
        selectable: false,
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        },
        events: function(fetchInfo, successCallback, failureCallback) {
            fetch("{% url 'visites:agenda_ministre_events' %}?start=" + encodeURIComponent(fetchInfo.startStr) + "&end=" + encodeURIComponent(fetchInfo.endStr), {
                headers: { 'Accept': 'application/json' }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data || data.success === false) {
                    failureCallback();
                    return;
                }
                try {
                    var dbg = document.getElementById('events-debug');
                    if (dbg) {
                        var items = (data.events || []).map(function(ev) { return '<li>' + (ev.title || '(sans titre)') + '</li>'; }).join('');
                        dbg.innerHTML = '<div class="fw-semibold">Événements chargés:</div><ul class="mb-0">' + items + '</ul>';
                        dbg.style.display = 'block';
                    }
                } catch (e) {}
                successCallback(data.events || []);
            })
            .catch(function() {
                failureCallback();
            });
        },
        eventClick: function(info) {
            info.jsEvent.preventDefault();
            var title = (info.event.extendedProps && info.event.extendedProps.sujet) ? info.event.extendedProps.sujet : info.event.title;
            showAgendaModal(title, renderEventDetails(info.event));
        },
        dateClick: function(info) {
            var clicked = info.dateStr;
            var events = calendar.getEvents().filter(function(ev) {
                try {
                    return ev.start && ev.start.toISOString().slice(0, 10) === clicked;
                } catch (e) {
                    return false;
                }
            });

            if (!events.length) {
                showAgendaModal('Agenda du ' + clicked, '<div class="alert alert-info mb-0">Aucun rendez-vous confirmé pour cette date.</div>');
                return;
            }

            var items = events
                .sort(function(a, b) { return (a.start || 0) - (b.start || 0); })
                .map(function(ev) {
                    var p = ev.extendedProps || {};
                    var time = '';
                    try {
                        time = ev.start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    } catch (e) {}
                    return (
                        '<div class="agenda-modal-card mb-2">'
                        + '  <div class="card-body-in">'
                        + '    <div class="d-flex justify-content-between align-items-start gap-2">'
                        + '      <div>'
                        + '        <div class="fw-bold" style="font-size: 14px;">' + escapeHtml(p.sujet || ev.title) + '</div>'
                        + '        <div class="text-muted" style="font-size: 13px;">' + escapeHtml((p.motif || '-') + ' • ' + (p.visiteur || '-') ) + '</div>'
                        + '      </div>'
                        + '      <div class="fw-semibold" style="white-space:nowrap;">' + escapeHtml(time) + '</div>'
                        + '    </div>'
                        + '    <div class="mt-2">'
                        + '      <button type="button" class="btn btn-sm btn-outline-primary" data-ev-id="' + escapeHtml(ev.id) + '"><i class="bi bi-eye"></i> Détails</button>'
                        + '    </div>'
                        + '  </div>'
                        + '</div>'
                    );
                })
                .join('');

            showAgendaModal('Agenda du ' + clicked, items);

            try {
                document.querySelectorAll('#agendaModalBody [data-ev-id]').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var id = btn.getAttribute('data-ev-id');
                        var ev = calendar.getEventById(id);
                        if (!ev) return;
                        var title = (ev.extendedProps && ev.extendedProps.sujet) ? ev.extendedProps.sujet : ev.title;
                        showAgendaModal(title, renderEventDetails(ev));
                    });
                });
            } catch (e) {}
        }
    });

    calendar.render();
});
</script>
{% endblock %}
