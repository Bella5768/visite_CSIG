{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="page-title-bar">
    <div>
        <h2><i class="bi bi-calendar2-week"></i> Agenda du Ministre</h2>
        <div class="subtitle">Calendrier des audiences (MENA-ETFP)</div>
    </div>
    <div class="actions">
        <button type="button" class="btn btn-primary" id="agendaPrintViewBtn">
            <i class="bi bi-printer"></i> Imprimer
        </button>
        <a href="#" class="btn-primary-gradient" id="agendaExportPdfBtn">
            <i class="bi bi-filetype-pdf"></i> Exporter (PDF)
        </a>
    </div>
</div>

<div class="card-section">
    <div class="card-body">
        <div id="calendar" style="min-height: 700px;"></div>
        <div id="events-debug" class="mt-3" style="display:none;"></div>
    </div>
</div>

<div class="modal fade" id="agendaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header agenda-modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2" id="agendaModalTitle">
          <span class="agenda-modal-icon"><i class="bi bi-calendar2-event"></i></span>
          <span>Détails</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body agenda-modal-body" id="agendaModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="agendaPrintBtn">
          <i class="bi bi-printer"></i> Imprimer / PDF
        </button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
(function() {
    function onReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }
    onReady(function() {
    var calendarEl = document.getElementById('calendar');
    var lastModalTitle = '';
    var lastModalQrText = '';
    var exportPdfBtn = document.getElementById('agendaExportPdfBtn');
    var ministryLogoUrl = "{% static 'images/mena-etfp.png' %}";

    function loadCssOnce(href) {
        return new Promise(function(resolve, reject) {
            try {
                if (!href) return resolve();
                var exists = false;
                document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l) {
                    if ((l.getAttribute('href') || '') === href) exists = true;
                });
                if (exists) return resolve();
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                link.onload = function() { resolve(); };
                link.onerror = function() { reject(new Error('css_failed')); };
                document.head.appendChild(link);
            } catch (e) { reject(e); }
        });
    }

    function loadScriptOnce(src) {
        return new Promise(function(resolve, reject) {
            try {
                if (!src) return resolve();
                var exists = false;
                document.querySelectorAll('script').forEach(function(s) {
                    if ((s.getAttribute('src') || '') === src) exists = true;
                });
                if (exists) return resolve();
                var script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = function() { resolve(); };
                script.onerror = function() { reject(new Error('script_failed')); };
                document.head.appendChild(script);
            } catch (e) { reject(e); }
        });
    }

    function ensureFullCalendar() {
        if (window.FullCalendar && window.FullCalendar.Calendar) return Promise.resolve();
        var jsPrimary = 'https://cdn.jsdelivr.net/npm/fullcalendar@6/index.global.min.js';
        var jsFallback = 'https://unpkg.com/fullcalendar@6/index.global.min.js';
        return loadScriptOnce(jsPrimary)
            .catch(function() { return loadScriptOnce(jsFallback); })
            .then(function() {
                if (window.FullCalendar && window.FullCalendar.Calendar) return;
                throw new Error('fullcalendar_missing');
            });
    }

    function ensureQrCode() {
        if (typeof QRCode !== 'undefined' && QRCode && QRCode.toCanvas) return Promise.resolve();
        var jsPrimary = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
        var jsFallback = 'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js';
        return loadScriptOnce(jsPrimary)
            .catch(function() { return loadScriptOnce(jsFallback); })
            .then(function() {
                if (typeof QRCode !== 'undefined' && QRCode && QRCode.toCanvas) return;
                throw new Error('qrcode_missing');
            });
    }

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function showAgendaModal(title, htmlBody) {
        var titleEl = document.getElementById('agendaModalTitle');
        var bodyEl = document.getElementById('agendaModalBody');
        if (titleEl) titleEl.textContent = title || 'Détails';
        if (bodyEl) bodyEl.innerHTML = htmlBody || '';
        lastModalTitle = title || 'Détails';
        try {
            var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('agendaModal'));
            modal.show();
            try {
                if (bodyEl) {
                    renderQrCanvases(bodyEl);
                }
            } catch (e) {}
        } catch (e) {
            alert(title + "\n\n" + (bodyEl ? bodyEl.textContent : ''));
        }
    }

    function renderQrCanvases(root) {
        if (!root) return;
        ensureQrCode().then(function() {
            try {
                root.querySelectorAll('canvas[data-qr-text]').forEach(function(c) {
                    var text = c.getAttribute('data-qr-text') || '';
                    if (!text) return;
                    QRCode.toCanvas(c, text, {
                        errorCorrectionLevel: 'M',
                        margin: 1,
                        width: 220,
                        color: {
                            dark: '#0b3a1e',
                            light: '#ffffff'
                        }
                    }, function() {});
                });
            } catch (e) {}
        }).catch(function() {});
    }

    function openPrintWindow() {
        var bodyEl = document.getElementById('agendaModalBody');
        if (!bodyEl) return;
        var printHtml = bodyEl.innerHTML;
        var w = window.open('', '_blank');
        if (!w) return;

        function formatNow() {
            try {
                return new Date().toLocaleString('fr-FR', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (e) {
                return '';
            }
        }

        var printedAt = formatNow();
        var title = lastModalTitle || 'Rendez-vous';

        var refLine = '';
        try {
            if (lastModalQrText) {
                refLine = '<div><span class="label">Référence:</span> ' + escapeHtml(lastModalQrText.split('|')[0] || '') + '</div>';
            }
        } catch (e) { refLine = ''; }

        var header = (
          '<div class="doc-header">'
          + '  <div style="display:flex;align-items:center;gap:12px;">'
          + '    <div style="width:44px;height:44px;border:1px solid rgba(15,23,42,0.12);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;">'
          + '      <img src="' + ministryLogoUrl + '" alt="MENA-ETFP" style="width:100%;height:100%;object-fit:contain;padding:6px;" />'
          + '    </div>'
          + '    <div>'
          + '      <div style="font-size:11px;font-weight:950;letter-spacing:0.3px;text-transform:uppercase;color:#0b3a1e;">République de Guinée</div>'
          + '      <div style="font-size:12px;font-weight:900;color:#0f172a;">Ministère de l’Enseignement Pré-Universitaire et de l’Alphabétisation</div>'
          + '      <div style="font-size:11px;font-weight:800;color:#475569;">Cabinet du Ministre — Agenda / Convocation</div>'
          + '    </div>'
          + '  </div>'
          + '  <div class="doc-meta">'
          + '    <div><span class="label">Imprimé le:</span> ' + escapeHtml(printedAt) + '</div>'
          +      refLine
          + '  </div>'
          + '</div>'
        );

        var css = `
            @page { size: A4; margin: 14mm; }
            * { box-sizing: border-box; }
            body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;color:#0f172a;background:#fff;}
            .doc{padding:0;}
            .doc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(15,23,42,0.12);} 
            .doc-title{font-size:18px;font-weight:950;margin:0;letter-spacing:-0.2px;}
            .doc-meta{font-size:12px;color:#475569;font-weight:700;text-align:right;line-height:1.4;}
            .doc-meta .label{font-weight:900;color:#0b3a1e;}
            .doc-body{margin-top:12px;}
            .agenda-modal-card,.agenda-desc{border:1px solid rgba(15,23,42,0.12);border-radius:14px;box-shadow:none !important;overflow:hidden;background:#fff;}
            .agenda-modal-card .card-head{background:#f8fafc;border-bottom:1px solid rgba(15,23,42,0.10);} 
            .agenda-modal-card .card-title{font-weight:950;color:#0b3a1e;}
            .agenda-badge{padding:6px 10px;border-radius:999px;font-weight:950;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;}
            .row{display:flex;gap:12px;align-items:stretch;}
            .col-md-6{flex:1;min-width:0;}
            .mt-3{margin-top:12px;}
            .mb-2{margin-bottom:10px;}
            a{color:inherit;text-decoration:none;}
            .convocation-qr canvas{width:140px;height:140px;}
            @media print{.no-print{display:none !important;} body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
        `;

        var html = `
            <!doctype html>
            <html>
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>${escapeHtml(title)}</title>
                <style>${css}</style>
              </head>
              <body>
                <div class="doc">
                  ${header}
                  <h1 class="doc-title">${escapeHtml(title)}</h1>
                  <div class="doc-body">${printHtml}</div>
                </div>
                <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
                <script>
                  window.onload=function(){
                    try { document.querySelectorAll('canvas[data-qr-text]').forEach(function(c){
                      if (typeof QRCode==='undefined' || !QRCode || !QRCode.toCanvas) return;
                      var text=c.getAttribute('data-qr-text')||'';
                      if(!text) return;
                      QRCode.toCanvas(c, text, {errorCorrectionLevel:'M',margin:1,width:220,color:{dark:'#0b3a1e',light:'#ffffff'}}, function(){});
                    }); } catch(e) {}
                    window.print();
                  };
                <\/script>
              </body>
            </html>
        `;

        w.document.open();
        w.document.write(html);
        w.document.close();
        w.focus();
    }

    function renderEventDetails(event) {
        var p = event.extendedProps || {};
        var desc = (p.description || '').trim();
        var statutCode = (p.statut_code || '').trim();
        var badgeClass = (statutCode || '').replace('-', '_') || 'confirme';
        var badgeLabel = p.statut || statutCode || '-';
        var badgeIcon = 'bi-check2-circle';
        if (badgeClass === 'en_cours') badgeIcon = 'bi-hourglass-split';
        if (badgeClass === 'annule') badgeIcon = 'bi-x-circle';
        if (badgeClass === 'planifie') badgeIcon = 'bi-calendar2';
        if (badgeClass === 'termine') badgeIcon = 'bi-check-circle';
        function safeTel(t) {
            return String(t || '').replace(/\s+/g, '');
        }
        function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                    return;
                }
            } catch (e) {}
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            } catch (e) {}
        }

        var tel = p.telephone || '';
        var email = p.email || '';

        var ref = 'RDV-' + escapeHtml(event.id || '') + '-' + escapeHtml((p.date || '').replace(/\//g, ''));
        var horaire = ((p.heure_debut || '') + ' - ' + (p.heure_fin || '')).trim();
        var sujet = p.sujet || event.title || 'Rendez-vous';
        var qrText = [ref, (p.date || ''), horaire, (p.visiteur || '')].filter(Boolean).join('|');
        lastModalQrText = qrText;

        var html = [
            '<div class="convocation-sheet">',
            '  <div class="convocation-top">',
            '    <div class="convocation-head">',
            '      <div class="convocation-brand">',
            '        <div class="convocation-logo"><img src="' + escapeHtml(ministryLogoUrl) + '" alt="MENA-ETFP"></div>',
            '        <div class="convocation-brand-text">',
            '          <div class="l1">République de Guinée</div>',
            '          <div class="l2">Ministère de l’Enseignement Pré-Universitaire et de l’Alphabétisation</div>',
            '          <div class="l3">Cabinet du Ministre — Convocation / Audience</div>',
            '        </div>',
            '      </div>',
            '      <div class="convocation-doc-meta">',
            '        <div><span class="k">Référence:</span> ' + escapeHtml(ref) + '</div>',
            '        <div><span class="k">Statut:</span> <span class="agenda-badge ' + escapeHtml(badgeClass) + '"><i class="bi ' + escapeHtml(badgeIcon) + '"></i> ' + escapeHtml(badgeLabel) + '</span></div>',
            '      </div>',
            '    </div>',
            '    <div class="convocation-title">Convocation officielle — ' + escapeHtml(sujet) + '</div>',
            '    <div class="convocation-subtitle">Document interne — à présenter à l’accueil / protocole</div>',
            '  </div>',
            '  <div class="convocation-body">',
            '    <div class="convocation-grid">',
            '      <div>',
            '        <div class="convocation-panel">',
            '          <div class="ph">',
            '            <div class="t"><i class="bi bi-calendar2-check"></i> Informations du rendez-vous</div>',
            '          </div>',
            '          <div class="pb">',
            '            <div class="convocation-kv">',
            '              <div class="k"><i class="bi bi-card-text"></i> Sujet</div><div class="v">' + escapeHtml(sujet) + '</div>',
            '              <div class="k"><i class="bi bi-tag"></i> Motif</div><div class="v">' + escapeHtml(p.motif || '-') + '</div>',
            '              <div class="k"><i class="bi bi-calendar3"></i> Date</div><div class="v">' + escapeHtml(p.date || '-') + '</div>',
            '              <div class="k"><i class="bi bi-clock"></i> Heure</div><div class="v">' + escapeHtml(horaire || '-') + '</div>',
            '              <div class="k"><i class="bi bi-person"></i> Demandeur</div><div class="v">' + escapeHtml(p.visiteur || '-') + '</div>',
            '              <div class="k"><i class="bi bi-building"></i> Correspondant</div><div class="v">' + escapeHtml(p.correspondant || '-') + '</div>',
            '            </div>',
            (desc ? ('            <div class="convocation-note">' + escapeHtml(desc) + '</div>') : ''),
            '            <div class="convocation-protocole">',
            '              <div class="h"><i class="bi bi-shield-check"></i> Protocole & Accueil</div>',
            '              <div class="li">- Arriver 10 minutes avant l’heure prévue.</div>',
            '              <div class="li">- Présenter une pièce d’identité + ce document (ou QR) à l’accueil.</div>',
            '              <div class="li">- Accès soumis aux consignes de sécurité du Cabinet.</div>',
            '            </div>',
            '            <div class="convocation-actions">',
            (tel ? ('              <a class="btn-doc-primary" href="tel:' + escapeHtml(safeTel(tel)) + '"><i class="bi bi-telephone-outbound"></i> Appeler</a>') : ''),
            (email ? ('              <a class="btn-doc" href="mailto:' + escapeHtml(email) + '"><i class="bi bi-envelope-at"></i> Email</a>') : ''),
            (tel ? ('              <button type="button" class="btn-doc" onclick="(' + copyToClipboard.toString() + ')(' + JSON.stringify(String(tel)) + ')"><i class="bi bi-clipboard"></i> Copier téléphone</button>') : ''),
            (email ? ('              <button type="button" class="btn-doc" onclick="(' + copyToClipboard.toString() + ')(' + JSON.stringify(String(email)) + ')"><i class="bi bi-clipboard"></i> Copier email</button>') : ''),
            '            </div>',
            '          </div>',
            '        </div>',
            '      </div>',
            '      <div>',
            '        <div class="convocation-qr">',
            '          <canvas data-qr-text="' + escapeHtml(qrText) + '"></canvas>',
            '          <div class="cap">Scanner pour vérifier la référence<br><span style="font-weight:950;color:#0b3a1e;">' + escapeHtml(ref) + '</span></div>',
            '        </div>',
            '      </div>',
            '    </div>',
            '  </div>',
            '</div>'
        ].join('');

        return html;
    }

    function printCurrentView(calendar) {
        if (!calendar) return;
        var view = calendar.view;
        var start = view && view.activeStart ? new Date(view.activeStart) : null;
        var end = view && view.activeEnd ? new Date(view.activeEnd) : null;
        var title = (view && view.title) ? view.title : 'Agenda';

        var evs = calendar.getEvents().filter(function(ev) {
            if (!ev.start) return false;
            if (start && ev.start < start) return false;
            if (end && ev.start >= end) return false;
            return true;
        });

        evs.sort(function(a, b) { return (a.start || 0) - (b.start || 0); });

        var listHtml = evs.map(function(ev) {
            var p = ev.extendedProps || {};
            var date = p.date || '';
            var time = (p.heure_debut || '') + ' - ' + (p.heure_fin || '');
            return (
                '<tr>'
                + '<td style="white-space:nowrap;">' + escapeHtml(date) + '</td>'
                + '<td style="white-space:nowrap;">' + escapeHtml(time) + '</td>'
                + '<td>' + escapeHtml(p.motif || '-') + '</td>'
                + '<td>' + escapeHtml(p.sujet || ev.title) + '</td>'
                + '<td>' + escapeHtml(p.visiteur || '-') + '</td>'
                + '</tr>'
            );
        }).join('');

        var html = (
            '<div class="agenda-modal-card">'
            + '<div class="card-head"><p class="card-title mb-0"><i class="bi bi-list-check"></i> ' + escapeHtml(title) + '</p></div>'
            + '<div class="card-body-in">'
            + (evs.length ? (
                '<div class="table-responsive">'
                + '<table class="table table-sm table-bordered mb-0">'
                + '<thead><tr>'
                + '<th>Date</th><th>Heure</th><th>Motif</th><th>Sujet</th><th>Demandeur</th>'
                + '</tr></thead>'
                + '<tbody>' + listHtml + '</tbody>'
                + '</table></div>'
            ) : '<div class="alert alert-info mb-0">Aucun rendez-vous dans cette vue.</div>')
            + '</div></div>'
        );

        lastModalTitle = 'Agenda du Ministre';
        showAgendaModal('Impression', html);
        openPrintWindow();
    }

    function initCalendar() {
        if (!calendarEl) return;
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: (window.innerWidth && window.innerWidth < 768) ? 'listWeek' : 'dayGridMonth',
            height: 'auto',
            locale: 'fr',
            eventDisplay: 'block',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek,listDay'
            },
            navLinks: true,
            nowIndicator: true,
            selectable: false,
            eventTimeFormat: {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            },
            events: function(fetchInfo, successCallback, failureCallback) {
                fetch("{% url 'visites:agenda_ministre_events' %}?start=" + encodeURIComponent(fetchInfo.startStr) + "&end=" + encodeURIComponent(fetchInfo.endStr), {
                    headers: { 'Accept': 'application/json' }
                })
                .then(function(r) {
                    var ct = (r.headers && r.headers.get) ? (r.headers.get('Content-Type') || '') : '';
                    var isJson = ct.toLowerCase().indexOf('application/json') !== -1;
                    if (!r.ok || !isJson) {
                        try {
                            if (r.status === 401) {
                                showAgendaModal('Connexion requise', '<div class="alert alert-warning mb-0">Votre session a expiré. Veuillez vous reconnecter pour afficher l\'agenda.</div>');
                            } else if (r.status === 403) {
                                showAgendaModal('Accès refusé', '<div class="alert alert-danger mb-0">Vous n\'avez pas l\'autorisation d\'accéder à l\'agenda.</div>');
                            }
                        } catch (e) {}
                        failureCallback();
                        return null;
                    }
                    return r.json();
                })
                .then(function(data) {
                    if (!data || data.success === false) {
                        failureCallback();
                        return;
                    }
                    try {
                        var dbg = document.getElementById('events-debug');
                        if (dbg) {
                            var items = (data.events || []).map(function(ev) { return '<li>' + (ev.title || '(sans titre)') + '</li>'; }).join('');
                            dbg.innerHTML = '<div class="fw-semibold">Événements chargés:</div><ul class="mb-0">' + items + '</ul>';
                            dbg.style.display = 'block';
                        }
                    } catch (e) {}
                    successCallback(data.events || []);
                })
                .catch(function() {
                    failureCallback();
                });
            },
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                var title = (info.event.extendedProps && info.event.extendedProps.sujet) ? info.event.extendedProps.sujet : info.event.title;
                showAgendaModal(title, renderEventDetails(info.event));
            },
            dateClick: function(info) {
                var clicked = info.dateStr;
                var events = calendar.getEvents().filter(function(ev) {
                    try {
                        return ev.start && ev.start.toISOString().slice(0, 10) === clicked;
                    } catch (e) {
                        return false;
                    }
                });

                if (!events.length) {
                    showAgendaModal('Agenda du ' + clicked, '<div class="alert alert-info mb-0">Aucun rendez-vous confirmé pour cette date.</div>');
                    return;
                }

                var items = events
                    .sort(function(a, b) { return (a.start || 0) - (b.start || 0); })
                    .map(function(ev) {
                        var p = ev.extendedProps || {};
                        var time = '';
                        try {
                            time = ev.start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                        } catch (e) {}
                        return (
                            '<div class="agenda-modal-card mb-2">'
                            + '  <div class="card-body-in">'
                            + '    <div class="d-flex justify-content-between align-items-start gap-2">'
                            + '      <div>'
                            + '        <div class="fw-bold" style="font-size: 14px;">' + escapeHtml(p.sujet || ev.title) + '</div>'
                            + '        <div class="text-muted" style="font-size: 13px;">' + escapeHtml((p.motif || '-') + ' • ' + (p.visiteur || '-') ) + '</div>'
                            + '      </div>'
                            + '      <div class="fw-semibold" style="white-space:nowrap;">' + escapeHtml(time) + '</div>'
                            + '    </div>'
                            + '    <div class="mt-2">'
                            + '      <button type="button" class="btn btn-sm btn-outline-primary" data-ev-id="' + escapeHtml(ev.id) + '"><i class="bi bi-eye"></i> Détails</button>'
                            + '    </div>'
                            + '  </div>'
                            + '</div>'
                        );
                    })
                    .join('');

                showAgendaModal('Agenda du ' + clicked, items);

                try {
                    document.querySelectorAll('#agendaModalBody [data-ev-id]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var id = btn.getAttribute('data-ev-id');
                            var ev = calendar.getEventById(id);
                            if (!ev) return;
                            var title = (ev.extendedProps && ev.extendedProps.sujet) ? ev.extendedProps.sujet : ev.title;
                            showAgendaModal(title, renderEventDetails(ev));
                        });
                    });
                } catch (e) {}
            }
        });

        calendar.render();

        function updateExportLink() {
            if (!exportPdfBtn) return;
            try {
                var view = calendar.view;
                var start = view.activeStart ? view.activeStart.toISOString().slice(0, 10) : '';
                var end = view.activeEnd ? view.activeEnd.toISOString().slice(0, 10) : '';
                if (exportPdfBtn) {
                    var urlPdf = "{% url 'visites:agenda_ministre_export_pdf' %}" + "?start=" + encodeURIComponent(start) + "&end=" + encodeURIComponent(end);
                    exportPdfBtn.setAttribute('href', urlPdf);
                }
            } catch (e) {}
        }

        updateExportLink();
        calendar.on('datesSet', function() {
            updateExportLink();
        });

        try {
            var printBtn = document.getElementById('agendaPrintBtn');
            if (printBtn) {
                printBtn.addEventListener('click', function() {
                    openPrintWindow();
                });
            }
        } catch (e) {}

        try {
            var printViewBtn = document.getElementById('agendaPrintViewBtn');
            if (printViewBtn) {
                printViewBtn.addEventListener('click', function() {
                    printCurrentView(calendar);
                });
            }
        } catch (e) {}

        return calendar;
    }

    ensureFullCalendar()
        .then(function() {
            initCalendar();
        })
        .catch(function() {
            try {
                if (calendarEl) {
                    calendarEl.innerHTML = '<div class="alert alert-warning mb-0">Impossible de charger le calendrier (FullCalendar). Vérifie ta connexion Internet ou le blocage CDN (jsdelivr/unpkg) puis recharge la page.</div>';
                }
            } catch (e) {}
        });
    });
})();
</script>
{% endblock %}
