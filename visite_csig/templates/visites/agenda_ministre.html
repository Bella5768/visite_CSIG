{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="page-title-bar">
    <div>
        <h2><i class="bi bi-calendar2-week"></i> Agenda du Ministre</h2>
        <div class="subtitle">Calendrier des audiences (MENA-ETFP)</div>
    </div>
    <div class="actions">
        <button type="button" class="btn btn-primary" id="agendaPrintViewBtn">
            <i class="bi bi-printer"></i> Imprimer
        </button>
        <a href="#" class="btn-primary-gradient" id="agendaExportPdfBtn">
            <i class="bi bi-filetype-pdf"></i> Exporter (PDF)
        </a>
    </div>
</div>

<div class="card-section">
    <div class="card-body">
        <div id="calendar" style="min-height: 700px;"></div>
        <div id="events-debug" class="mt-3" style="display:none;"></div>
    </div>
</div>

<div class="modal fade" id="agendaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header agenda-modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2" id="agendaModalTitle">
          <span class="agenda-modal-icon"><i class="bi bi-calendar2-event"></i></span>
          <span>Détails</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body agenda-modal-body" id="agendaModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="agendaPrintBtn">
          <i class="bi bi-printer"></i> Imprimer / PDF
        </button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var exportPdfBtn = document.getElementById('agendaExportPdfBtn');
    var eventsUrl = "{% url 'visites:agenda_ministre_events' %}";

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function eventDateRange() {
        var today = new Date();
        var start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        var end = new Date(today.getFullYear(), today.getMonth() + 2, 1);
        return {
            start: start.toISOString().slice(0, 10),
            end: end.toISOString().slice(0, 10)
        };
    }

    function fetchEvents(start, end) {
        return fetch(eventsUrl + '?start=' + encodeURIComponent(start) + '&end=' + encodeURIComponent(end), {
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin'
        })
        .then(function(resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
        })
        .then(function(data) {
            if (!data || data.success === false) throw new Error((data && data.message) || 'Erreur agenda');
            return data.events || [];
        });
    }

    function renderFallback(events, message) {
        if (!calendarEl) return;
        var html = '';
        if (message) {
            html += '<div class="alert alert-warning mb-3">' + escapeHtml(message) + '</div>';
        }
        html += '<div class="agenda-fallback">';
        html += '<div class="agenda-fallback-title"><i class="bi bi-calendar-check"></i> Rendez-vous confirm?s</div>';
        if (!events.length) {
            html += '<div class="rdv-empty"><i class="bi bi-calendar-x"></i><div>Aucun rendez-vous confirm? dans cette p?riode.</div></div>';
        } else {
            html += '<div class="agenda-fallback-list">';
            events.forEach(function(ev) {
                var p = ev.extendedProps || {};
                html += '<button type="button" class="agenda-fallback-item" data-event-id="' + escapeHtml(ev.id) + '">';
                html += '<span class="agenda-fallback-date">' + escapeHtml(p.date || (ev.start || '').slice(0,10)) + '</span>';
                html += '<span class="agenda-fallback-main"><strong>' + escapeHtml(p.sujet || ev.title) + '</strong><small>' + escapeHtml((p.heure_debut || '') + ' - ' + (p.heure_fin || '') + '  ' + (p.visiteur || '')) + '</small></span>';
                html += '<span class="agenda-fallback-status">' + escapeHtml(p.statut || 'Confirm?') + '</span>';
                html += '</button>';
            });
            html += '</div>';
        }
        html += '</div>';
        calendarEl.innerHTML = html;
        calendarEl.querySelectorAll('[data-event-id]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var ev = events.find(function(item) { return String(item.id) === String(btn.getAttribute('data-event-id')); });
                if (ev) showEventDetails(ev);
            });
        });
    }

    function showEventDetails(event) {
        var p = event.extendedProps || {};
        var body = '';
        body += '<div class="agenda-modal-card"><div class="card-body-in">';
        body += '<div class="agenda-kv">';
        body += '<div class="k"><i class="bi bi-card-text"></i> Sujet</div><div class="v">' + escapeHtml(p.sujet || event.title) + '</div>';
        body += '<div class="k"><i class="bi bi-tag"></i> Motif</div><div class="v">' + escapeHtml(p.motif || '-') + '</div>';
        body += '<div class="k"><i class="bi bi-calendar3"></i> Date</div><div class="v">' + escapeHtml(p.date || '-') + '</div>';
        body += '<div class="k"><i class="bi bi-clock"></i> Heure</div><div class="v">' + escapeHtml((p.heure_debut || '') + ' - ' + (p.heure_fin || '')) + '</div>';
        body += '<div class="k"><i class="bi bi-person"></i> Demandeur</div><div class="v">' + escapeHtml(p.visiteur || '-') + '</div>';
        body += '<div class="k"><i class="bi bi-building"></i> Correspondant</div><div class="v">' + escapeHtml(p.correspondant || '-') + '</div>';
        body += '<div class="k"><i class="bi bi-check-circle"></i> Statut</div><div class="v">' + escapeHtml(p.statut || '-') + '</div>';
        body += '</div>';
        if (p.description) {
            body += '<div class="agenda-desc mt-3"><div class="title"><i class="bi bi-text-left"></i> Description</div><p class="text">' + escapeHtml(p.description) + '</p></div>';
        }
        body += '</div></div>';

        var titleEl = document.getElementById('agendaModalTitle');
        var bodyEl = document.getElementById('agendaModalBody');
        if (titleEl) titleEl.textContent = p.sujet || event.title || 'Rendez-vous';
        if (bodyEl) bodyEl.innerHTML = body;
        try {
            bootstrap.Modal.getOrCreateInstance(document.getElementById('agendaModal')).show();
        } catch (e) {
            alert((p.sujet || event.title || 'Rendez-vous') + '\n' + (bodyEl ? bodyEl.textContent : ''));
        }
    }

    function initFullCalendar() {
        if (!calendarEl) return;
        if (!window.FullCalendar || !window.FullCalendar.Calendar) {
            var range = eventDateRange();
            fetchEvents(range.start, range.end)
                .then(function(events) { renderFallback(events, 'Calendrier indisponible : affichage en liste.'); })
                .catch(function(err) { renderFallback([], 'Impossible de charger les rendez-vous : ' + err.message); });
            return;
        }

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'fr',
            height: 'auto',
            firstDay: 1,
            nowIndicator: true,
            eventDisplay: 'block',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
            },
            buttonText: {
                today: "Aujourd'hui",
                month: 'Mois',
                week: 'Semaine',
                day: 'Jour',
                list: 'Liste'
            },
            events: function(fetchInfo, successCallback, failureCallback) {
                fetchEvents(fetchInfo.startStr, fetchInfo.endStr)
                    .then(function(events) {
                        successCallback(events);
                        if (!events.length) {
                            var range = eventDateRange();
                            return fetchEvents(range.start, range.end).then(function(fallbackEvents) {
                                if (fallbackEvents.length) renderFallback(fallbackEvents, 'Aucun rendez-vous dans la vue actuelle. Voici les prochains rendez-vous confirm?s.');
                            });
                        }
                    })
                    .catch(function(err) {
                        failureCallback(err);
                        var range = eventDateRange();
                        fetchEvents(range.start, range.end)
                            .then(function(events) { renderFallback(events, 'Calendrier indisponible : affichage en liste.'); })
                            .catch(function() { renderFallback([], 'Impossible de charger les rendez-vous : ' + err.message); });
                    });
            },
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                showEventDetails(info.event);
            },
            datesSet: function(info) {
                if (exportPdfBtn) {
                    exportPdfBtn.setAttribute('href', "{% url 'visites:agenda_ministre_export_pdf' %}" + '?start=' + encodeURIComponent(info.startStr) + '&end=' + encodeURIComponent(info.endStr));
                }
            }
        });
        calendar.render();

        var printViewBtn = document.getElementById('agendaPrintViewBtn');
        if (printViewBtn) {
            printViewBtn.addEventListener('click', function() { window.print(); });
        }
    }

    initFullCalendar();
});
</script>

    .agenda-fallback-list { display:grid; gap:10px; }
    .agenda-fallback-item { width:100%; border:1px solid rgba(15,23,42,.08); background:#f8fafc; border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:120px 1fr auto; gap:12px; align-items:center; text-align:left; }
    .agenda-fallback-item:hover { border-color:#2563eb; background:#eef4ff; }
    .agenda-fallback-date { font-weight:900; color:#2563eb; }
    .agenda-fallback-main { display:flex; flex-direction:column; gap:3px; color:#0f172a; }
    .agenda-fallback-main small { color:#64748b; font-weight:700; }
    .agenda-fallback-status { background:#dcfce7; color:#166534; border-radius:999px; padding:6px 10px; font-weight:900; font-size:12px; }

</style>
