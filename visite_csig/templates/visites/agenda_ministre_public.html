{% extends 'public_base.html' %}
{% block content %}
<div class="page-title-bar">
    <div>
        <h2><i class="bi bi-calendar2-week"></i> Agenda du Ministre</h2>
        <div class="subtitle">Lecture seule</div>
    </div>
    <div class="actions">
        <button type="button" class="btn btn-primary" id="agendaPublicPrintViewBtn">
            <i class="bi bi-printer"></i> Imprimer
        </button>
    </div>
</div>

<div class="card-section">
    <div class="card-body">
        <div id="calendar" style="min-height: 640px;"></div>
    </div>
</div>

<div class="modal fade" id="agendaPublicModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header agenda-modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2" id="agendaPublicModalTitle">
          <span class="agenda-modal-icon"><i class="bi bi-calendar2-event"></i></span>
          <span>Détails</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body agenda-modal-body" id="agendaPublicModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="agendaPublicPrintBtn">
          <i class="bi bi-printer"></i> Imprimer / PDF
        </button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<style>
  /* Variables CSS pour le thème moderne - couleurs du header */
  :root {
    --agenda-primary: #2563eb;
    --agenda-primary-dark: #1d4ed8;
    --agenda-primary-light: #3b82f6;
    --agenda-secondary: #1e3a5f;
    --agenda-success: #10b981;
    --agenda-warning: #f59e0b;
    --agenda-danger: #ef4444;
    --agenda-dark: #0f1629;
    --agenda-light: #f8fafc;
    --agenda-border: rgba(37, 99, 235, 0.12);
    --agenda-shadow: 0 20px 25px -5px rgba(30, 58, 95, 0.1), 0 10px 10px -5px rgba(30, 58, 95, 0.04);
    --agenda-shadow-sm: 0 4px 6px -1px rgba(30, 58, 95, 0.1), 0 2px 4px -1px rgba(30, 58, 95, 0.06);
  }

  .fc a { text-decoration: none; }
  .fc .fc-event,
  .fc .fc-event .fc-event-title,
  .fc .fc-event .fc-event-time,
  .fc .fc-event a { color: #fff !important; }
  .fc .fc-daygrid-event { display: block; }
  .fc .fc-daygrid-dot-event { display: block; }
  .fc .fc-daygrid-dot-event .fc-event-title { font-weight: 900; }
  .fc .fc-daygrid-dot-event .fc-event-time { font-weight: 900; }
  .fc .fc-event-title { display: inline !important; font-size: 12px !important; white-space: normal; }

  #calendar {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid var(--agenda-border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--agenda-shadow);
    position: relative;
    overflow: hidden;
  }

  #calendar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--agenda-secondary) 0%, var(--agenda-primary) 50%, var(--agenda-primary-light) 100%);
    border-radius: 20px 20px 0 0;
  }

  .fc .fc-toolbar-title {
    font-size: 24px;
    font-weight: 950;
    letter-spacing: -0.3px;
    color: var(--agenda-dark);
    background: linear-gradient(135deg, var(--agenda-primary) 0%, var(--agenda-primary-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 2px 4px rgba(99, 102, 241, 0.1);
  }

  .fc .fc-toolbar.fc-header-toolbar {
    margin-bottom: 20px;
    gap: 16px;
    padding: 16px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(34, 211, 238, 0.05) 100%);
    border-radius: 16px;
    border: 1px solid var(--agenda-border);
  }

  .fc .fc-button {
    border-radius: 12px;
    padding: 10px 16px;
    border: 2px solid var(--agenda-border) !important;
    background: linear-gradient(135deg, #ffffff 0%, var(--agenda-light) 100%) !important;
    color: var(--agenda-primary) !important;
    box-shadow: var(--agenda-shadow-sm);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 12px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .fc .fc-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
    transition: left 0.5s;
  }

  .fc .fc-button:hover::before {
    left: 100%;
  }

  .fc .fc-button:hover {
    background: linear-gradient(135deg, var(--agenda-primary-light) 0%, var(--agenda-primary) 100%) !important;
    color: #ffffff !important;
    border-color: var(--agenda-primary) !important;
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3) !important;
    transform: translateY(-2px);
  }

  .fc .fc-button:focus,
  .fc .fc-button:active,
  .fc .fc-button.fc-button-active {
    background: linear-gradient(135deg, var(--agenda-primary) 0%, var(--agenda-primary-dark) 100%) !important;
    color: #ffffff !important;
    border-color: var(--agenda-primary) !important;
    box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4) !important;
    transform: translateY(-1px);
  }

  .fc .fc-col-header-cell {
    background: linear-gradient(135deg, var(--agenda-secondary) 0%, var(--agenda-primary) 100%);
    border: none !important;
  }

  .fc .fc-col-header-cell-cushion {
    padding: 14px 8px;
    font-weight: 950;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-size: 13px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
  }

  .fc .fc-scrollgrid {
    border: 2px solid var(--agenda-border) !important;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--agenda-shadow-sm);
  }

  .fc .fc-now-indicator-line {
    border-color: #ef4444;
    border-width: 2px;
  }

  /* ======= GRID POLISH (MONTH/WEEK/DAY) ======= */
  .fc .fc-scrollgrid-section-body td,
  .fc .fc-scrollgrid-section-body th {
    border-color: rgba(15, 23, 42, 0.10) !important;
  }

  .fc .fc-daygrid-day-frame,
  .fc .fc-timegrid-col-frame {
    border-radius: 14px;
    overflow: hidden;
  }

  .fc .fc-daygrid-day {
    background: #ffffff;
    transition: background 120ms ease;
  }

  .fc .fc-daygrid-day:hover {
    background: rgba(16, 68, 128, 0.03);
  }

  .fc .fc-day-sat,
  .fc .fc-day-sun {
    background: rgba(2, 6, 23, 0.015);
  }

  .fc .fc-daygrid-day-top {
    padding: 8px 10px 4px;
  }

  .fc .fc-daygrid-day-number {
    padding: 12px;
    color: var(--agenda-dark);
    font-weight: 800;
    font-size: 16px;
  }

  .fc .fc-day-today {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(34, 211, 238, 0.08) 100%) !important;
    position: relative;
  }

  .fc .fc-day-today::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--agenda-primary) 0%, var(--agenda-secondary) 100%);
    border-radius: 16px 16px 0 0;
  }

  .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
    background: linear-gradient(135deg, var(--agenda-primary) 0%, var(--agenda-primary-dark) 100%);
    color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }

  .fc .fc-daygrid-day-events {
    padding: 2px 6px 8px;
  }

  .fc .fc-event {
    border-radius: 12px;
    padding: 6px 10px;
    border: 0 !important;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    font-weight: 800;
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .fc .fc-event::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.2) 100%);
  }

  .fc .fc-event:focus,
  .fc .fc-event:active {
    outline: 3px solid var(--agenda-primary);
    outline-offset: 3px;
    transform: scale(1.05);
  }

  .fc .fc-event:hover {
    filter: brightness(1.1) saturate(1.2);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
  }

  .fc .fc-daygrid-event-harness {
    margin: 4px 3px;
  }

  .fc .fc-daygrid-event {
    padding: 8px 12px;
    border-radius: 14px;
    margin: 6px 3px;
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
    background: linear-gradient(135deg, var(--agenda-primary) 0%, var(--agenda-primary-dark) 100%) !important;
  }

  .fc .fc-daygrid-event .fc-event-title {
    font-weight: 950;
    letter-spacing: -0.3px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    line-height: 1.2;
  }

  .fc .fc-daygrid-event .fc-event-time {
    opacity: 0.95;
    font-weight: 800;
    font-size: 11px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }

  .fc .fc-list {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(15, 23, 42, 0.10);
  }

  .fc .fc-list-day-cushion {
    background: rgba(16, 68, 128, 0.06);
    font-weight: 900;
    color: #0f2f57;
  }

  .fc .fc-list-event:hover td {
    background: rgba(16, 68, 128, 0.04);
  }

  /* Événements par statut avec couleurs différentes */
  .fc .fc-event[data-statut="confirme"] {
    background: linear-gradient(135deg, var(--agenda-success) 0%, #059669 100%) !important;
  }

  .fc .fc-event[data-statut="en_cours"] {
    background: linear-gradient(135deg, var(--agenda-warning) 0%, #d97706 100%) !important;
  }

  .fc .fc-event[data-statut="annule"] {
    background: linear-gradient(135deg, var(--agenda-danger) 0%, #dc2626 100%) !important;
    opacity: 0.8;
  }

  .fc .fc-event[data-statut="planifie"] {
    background: linear-gradient(135deg, var(--agenda-secondary) 0%, #06b6d4 100%) !important;
  }

  .fc .fc-event[data-statut="termine"] {
    background: linear-gradient(135deg, var(--agenda-primary-light) 0%, var(--agenda-primary) 100%) !important;
  }

  .agenda-modal-header {
    background: linear-gradient(135deg, var(--agenda-primary) 0%, var(--agenda-secondary) 100%);
    border-bottom: 2px solid var(--agenda-border);
    backdrop-filter: blur(10px);
  }

  .agenda-modal-header .modal-title {
    color: #ffffff;
    font-weight: 950;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
  }

  .agenda-modal-header .btn-close {
    filter: brightness(0) invert(1);
    opacity: 0.8;
  }

  .agenda-modal-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .agenda-modal-body {
    background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
    backdrop-filter: blur(10px);
  }

  .agenda-modal-card {
    border: 2px solid var(--agenda-border);
    border-radius: 20px;
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    box-shadow: var(--agenda-shadow);
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .agenda-modal-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }

  .agenda-modal-card .card-head {
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(34, 211, 238, 0.05) 100%);
    border-bottom: 2px solid var(--agenda-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .agenda-modal-card .card-title {
    margin: 0;
    font-weight: 950;
    letter-spacing: -0.3px;
    color: var(--agenda-dark);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
  }

  .agenda-modal-card .card-title i {
    color: var(--agenda-primary);
    font-size: 18px;
    background: linear-gradient(135deg, var(--agenda-primary) 0%, var(--agenda-secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .agenda-modal-card .card-body-in {
    padding: 16px;
  }

  .agenda-kv {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 10px 14px;
  }

  .agenda-kv .k {
    color: #64748b;
    font-weight: 900;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .agenda-kv .v {
    color: #0f172a;
    font-weight: 800;
    font-size: 13px;
  }

  .agenda-desc {
    border: 1px solid var(--agenda-border);
    border-radius: 16px;
    padding: 16px;
    background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
  }

  .agenda-desc .title {
    font-weight: 950;
    margin-bottom: 8px;
    color: var(--agenda-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .agenda-desc .text {
    margin: 0;
    white-space: pre-wrap;
    color: #0f172a;
    font-weight: 600;
  }

  /* Animations supplémentaires */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .agenda-modal-card {
    animation: fadeInUp 0.5s ease-out;
  }

  /* Effet de brillance sur le calendrier */
  #calendar {
    position: relative;
  }

  #calendar::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      45deg,
      transparent 30%,
      rgba(255, 255, 255, 0.1) 50%,
      transparent 70%
    );
    animation: shimmer 3s infinite;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% {
      transform: translateX(-100%) translateY(-100%) rotate(45deg);
    }
    100% {
      transform: translateX(100%) translateY(100%) rotate(45deg);
    }
  }

  @media (max-width: 576px) {
    .fc .fc-toolbar.fc-header-toolbar { flex-wrap: wrap; gap: 10px; }
    .fc .fc-toolbar-title { width: 100%; text-align: left; }
    .agenda-kv { grid-template-columns: 1fr; }
  }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
<style>
  /* Overrides placed after FullCalendar CSS to match internal agenda */
  .fc .fc-button,
  .fc .fc-button-primary,
  .fc .fc-button-primary:not(:disabled) {
    border-radius: 10px;
    padding: 8px 12px;
    border: 1px solid rgba(16, 68, 128, 0.22) !important;
    background: #ffffff !important;
    color: var(--primary-blue) !important;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-size: 12px;
  }

  .fc .fc-button:hover,
  .fc .fc-button-primary:hover {
    background: rgba(16, 68, 128, 0.05) !important;
    border-color: rgba(16, 68, 128, 0.35) !important;
    color: var(--primary-blue) !important;
  }

  .fc .fc-button:focus,
  .fc .fc-button:active,
  .fc .fc-button.fc-button-active,
  .fc .fc-button-primary:focus,
  .fc .fc-button-primary:active,
  .fc .fc-button-primary.fc-button-active,
  .fc .fc-button-primary:not(:disabled).fc-button-active {
    background: var(--primary-blue) !important;
    color: #ffffff !important;
    border-color: var(--primary-blue) !important;

  }
</style>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var lastModalTitle = '';

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function printCurrentView(calendar) {
        if (!calendar) return;
        var view = calendar.view;
        var start = view && view.activeStart ? new Date(view.activeStart) : null;
        var end = view && view.activeEnd ? new Date(view.activeEnd) : null;
        var title = (view && view.title) ? view.title : 'Agenda';

        var evs = calendar.getEvents().filter(function(ev) {
            if (!ev.start) return false;
            if (start && ev.start < start) return false;
            if (end && ev.start >= end) return false;
            return true;
        });

        evs.sort(function(a, b) { return (a.start || 0) - (b.start || 0); });

        var listHtml = evs.map(function(ev) {
            var p = ev.extendedProps || {};
            var date = p.date || '';
            var time = (p.heure_debut || '') + ' - ' + (p.heure_fin || '');
            return (
                '<tr>'
                + '<td style="white-space:nowrap;">' + escapeHtml(date) + '</td>'
                + '<td style="white-space:nowrap;">' + escapeHtml(time) + '</td>'
                + '<td>' + escapeHtml(p.motif || '-') + '</td>'
                + '<td>' + escapeHtml(p.sujet || ev.title) + '</td>'
                + '<td>' + escapeHtml(p.visiteur || '-') + '</td>'
                + '</tr>'
            );
        }).join('');

        var html = (
            '<div class="agenda-modal-card">'
            + '<div class="card-head"><p class="card-title mb-0"><i class="bi bi-list-check"></i> ' + escapeHtml(title) + '</p></div>'
            + '<div class="card-body-in">'
            + (evs.length ? (
                '<div class="table-responsive">'
                + '<table class="table table-sm table-bordered mb-0">'
                + '<thead><tr>'
                + '<th>Date</th><th>Heure</th><th>Motif</th><th>Sujet</th><th>Demandeur</th>'
                + '</tr></thead>'
                + '<tbody>' + listHtml + '</tbody>'
                + '</table></div>'
            ) : '<div class="alert alert-info mb-0">Aucun rendez-vous dans cette vue.</div>')
            + '</div></div>'
        );

        lastModalTitle = 'Agenda du Ministre';
        showModal('Impression', html);
        openPrintWindow();
    }

    function renderEventDetails(event) {
        var p = event.extendedProps || {};
        var desc = (p.description || '').trim();
        function safeTel(t) {
            return String(t || '').replace(/\s+/g, '');
        }
        function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                    return;
                }
            } catch (e) {}
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            } catch (e) {}
        }

        var tel = p.telephone || '';
        var email = p.email || '';
        var lines = [
            '<div class="row g-3">',
            '  <div class="col-md-6">',
            '    <div class="agenda-modal-card">',
            '      <div class="card-head">',
            '        <p class="card-title"><i class="bi bi-info-circle"></i> Rendez-vous</p>',
            '      </div>',
            '      <div class="card-body-in">',
            '        <div class="agenda-kv">',
            '          <div class="k"><i class="bi bi-card-text"></i> Sujet</div><div class="v">' + escapeHtml(p.sujet || event.title) + '</div>',
            '          <div class="k"><i class="bi bi-tag"></i> Motif</div><div class="v">' + escapeHtml(p.motif || '-') + '</div>',
            '          <div class="k"><i class="bi bi-calendar3"></i> Date</div><div class="v">' + escapeHtml(p.date || '-') + '</div>',
            '          <div class="k"><i class="bi bi-clock"></i> Heure</div><div class="v">' + escapeHtml((p.heure_debut || '') + ' - ' + (p.heure_fin || '')) + '</div>',
            '          <div class="k"><i class="bi bi-check2-circle"></i> Statut</div><div class="v">' + escapeHtml(p.statut || 'Confirmé') + '</div>',
            '        </div>',
            '      </div>',
            '    </div>',
            '  </div>',
            '  <div class="col-md-6">',
            '    <div class="agenda-modal-card">',
            '      <div class="card-head">',
            '        <p class="card-title"><i class="bi bi-person"></i> Demandeur</p>',
            '      </div>',
            '      <div class="card-body-in">',
            '        <div class="agenda-kv">',
            '          <div class="k"><i class="bi bi-person-badge"></i> Nom</div><div class="v">' + escapeHtml(p.visiteur || '-') + '</div>',
            '          <div class="k"><i class="bi bi-telephone"></i> Téléphone</div><div class="v">' + escapeHtml(tel || '-')
            + (tel ? (' <span class="ms-2 d-inline-flex gap-1">'
            + '<a class="btn btn-sm btn-outline-primary" href="tel:' + escapeHtml(safeTel(tel)) + '"><i class="bi bi-telephone-outbound"></i></a>'
            + '<button type="button" class="btn btn-sm btn-outline-secondary" onclick="(' + copyToClipboard.toString() + ')(' + JSON.stringify(String(tel)) + ')"><i class="bi bi-clipboard"></i></button>'
            + '</span>') : '')
            + '</div>',
            '          <div class="k"><i class="bi bi-envelope"></i> Email</div><div class="v">' + escapeHtml(email || '-')
            + (email ? (' <span class="ms-2 d-inline-flex gap-1">'
            + '<a class="btn btn-sm btn-outline-primary" href="mailto:' + escapeHtml(email) + '"><i class="bi bi-envelope-at"></i></a>'
            + '<button type="button" class="btn btn-sm btn-outline-secondary" onclick="(' + copyToClipboard.toString() + ')(' + JSON.stringify(String(email)) + ')"><i class="bi bi-clipboard"></i></button>'
            + '</span>') : '')
            + '</div>',
            '          <div class="k"><i class="bi bi-building"></i> Correspondant</div><div class="v">' + escapeHtml(p.correspondant || '-') + '</div>',
            '        </div>',
            '      </div>',
            '    </div>',
            '  </div>',
            '</div>'
        ];

        if (desc) {
            lines.push(
                '<div class="mt-3 agenda-desc">'
                + '<div class="title"><i class="bi bi-chat-left-text"></i> Description</div>'
                + '<p class="text">' + escapeHtml(desc) + '</p>'
                + '</div>'
            );
        }
        return lines.join('');
    }

    function showModal(title, bodyHtml) {
        var titleEl = document.getElementById('agendaPublicModalTitle');
        var bodyEl = document.getElementById('agendaPublicModalBody');
        if (titleEl) titleEl.textContent = title || 'Détails';
        if (bodyEl) bodyEl.innerHTML = bodyHtml || '';
        lastModalTitle = title || 'Détails';
        try {
            var modalEl = document.getElementById('agendaPublicModal');
            var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
        } catch (e) {}
    }

    function openPrintWindow() {
        var bodyEl = document.getElementById('agendaPublicModalBody');
        if (!bodyEl) return;
        var html = bodyEl.innerHTML || '';
        var title = lastModalTitle || 'Agenda';
        var w = window.open('', '_blank');
        if (!w) return;

        function formatNow() {
            try {
                return new Date().toLocaleString('fr-FR', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (e) {
                return '';
            }
        }

        var printedAt = formatNow();
        var css = `
            @page { size: A4; margin: 14mm; }
            * { box-sizing: border-box; }
            body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;color:#0f172a;background:#fff;}
            .doc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(15,23,42,0.12);} 
            .doc-title{font-size:18px;font-weight:950;margin:0;letter-spacing:-0.2px;}
            .doc-meta{font-size:12px;color:#475569;font-weight:700;text-align:right;line-height:1.4;}
            .doc-meta .label{font-weight:900;color:#0f2f57;}
            .agenda-modal-card,.agenda-desc{border:1px solid rgba(15,23,42,0.12);border-radius:14px;box-shadow:none !important;overflow:hidden;background:#fff;}
            .agenda-modal-card .card-head{background:#f8fafc;border-bottom:1px solid rgba(15,23,42,0.10);} 
            .agenda-modal-card .card-title{font-weight:950;color:#0f2f57;}
            .agenda-kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;}
            .agenda-kv .k{color:#64748b;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:0.4px;}
            .agenda-kv .v{color:#0f172a;font-weight:800;font-size:13px;}
            .agenda-desc{background:#f8fafc;}
            .agenda-desc .title{font-weight:950;color:#0f2f57;}
            @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
        `;

        var out = `
            <!doctype html>
            <html>
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>${escapeHtml(title)}</title>
                <style>${css}</style>
              </head>
              <body>
                <div class="doc-header">
                  <div>
                    <h1 class="doc-title">${escapeHtml(title)}</h1>
                    <div style="font-size:12px;color:#475569;font-weight:700;">Agenda du Ministre</div>
                  </div>
                  <div class="doc-meta">
                    <div><span class="label">Imprimé le:</span> ${escapeHtml(printedAt)}</div>
                  </div>
                </div>
                ${html}
                <script>window.onload=function(){window.print();};<\/script>
              </body>
            </html>
        `;

        w.document.open();
        w.document.write(out);
        w.document.close();
    }

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: (window.innerWidth && window.innerWidth < 768) ? 'listWeek' : 'dayGridMonth',
        height: 'auto',
        locale: 'fr',
        eventDisplay: 'block',
        navLinks: true,
        nowIndicator: true,
        selectable: false,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek,listDay'
        },
        buttonText: { today: "Aujourd'hui", month: 'Mois', week: 'Semaine', day: 'Jour', list: 'Liste' },
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        },
        events: function(fetchInfo, successCallback, failureCallback) {
            var url = "{% url 'agenda_ministre_public_events' token=agenda_token %}" + "?start=" + encodeURIComponent(fetchInfo.startStr) + "&end=" + encodeURIComponent(fetchInfo.endStr);
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var events = (data && Array.isArray(data)) ? data : ((data && data.events) ? data.events : []);
                    
                    // Ajouter les attributs data-statut pour le style CSS
                    events.forEach(function(event) {
                        if (event.extendedProps && event.extendedProps.statut) {
                            event.className = ['fc-event-' + event.extendedProps.statut];
                        }
                    });
                    
                    successCallback(events);
                    return;
                })
                .catch(function() {
                    try {
                        showModal('Erreur', '<div class="alert alert-warning mb-0">Impossible de charger les rendez-vous.</div>');
                    } catch (e) {}
                    if (failureCallback) failureCallback();
                });
        },
        eventDidMount: function(info) {
                // Ajouter l'attribut data-statut pour le style CSS
                if (info.event.extendedProps && info.event.extendedProps.statut) {
                    info.el.setAttribute('data-statut', info.event.extendedProps.statut);
                }
            },
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                var ev = info.event;
                var title = (ev.extendedProps && ev.extendedProps.sujet) ? ev.extendedProps.sujet : ev.title;
                showModal(title, renderEventDetails(ev));
            },
        dateClick: function(info) {
            var clicked = info.dateStr;
            var events = calendar.getEvents().filter(function(ev) {
                try {
                    return ev.start && ev.start.toISOString().slice(0, 10) === clicked;
                } catch (e) {
                    return false;
                }
            });

            if (!events.length) {
                showModal('Agenda du ' + clicked, '<div class="alert alert-info mb-0">Aucun rendez-vous confirmé pour cette date.</div>');
                return;
            }

            var items = events
                .sort(function(a, b) { return (a.start || 0) - (b.start || 0); })
                .map(function(ev) {
                    var p = ev.extendedProps || {};
                    var time = '';
                    try {
                        time = ev.start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    } catch (e) {}
                    return (
                        '<div class="agenda-modal-card mb-2">'
                        + '  <div class="card-body-in">'
                        + '    <div class="d-flex justify-content-between align-items-start gap-2">'
                        + '      <div>'
                        + '        <div class="fw-bold" style="font-size: 14px;">' + escapeHtml(p.sujet || ev.title) + '</div>'
                        + '        <div class="text-muted" style="font-size: 13px;">' + escapeHtml((p.motif || '-') + ' • ' + (p.visiteur || '-') ) + '</div>'
                        + '      </div>'
                        + '      <div class="fw-semibold" style="white-space:nowrap;">' + escapeHtml(time) + '</div>'
                        + '    </div>'
                        + '    <div class="mt-2">'
                        + '      <button type="button" class="btn btn-sm btn-outline-primary" data-ev-id="' + escapeHtml(ev.id) + '"><i class="bi bi-eye"></i> Détails</button>'
                        + '    </div>'
                        + '  </div>'
                        + '</div>'
                    );
                })
                .join('');

            showModal('Agenda du ' + clicked, items);

            try {
                document.querySelectorAll('#agendaPublicModalBody [data-ev-id]').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var id = btn.getAttribute('data-ev-id');
                        var ev = calendar.getEventById(id);
                        if (!ev) return;
                        var title = (ev.extendedProps && ev.extendedProps.sujet) ? ev.extendedProps.sujet : ev.title;
                        showModal(title, renderEventDetails(ev));
                    });
                });
            } catch (e) {}
        }
    });

    calendar.render();

    try {
        var printBtn = document.getElementById('agendaPublicPrintBtn');
        if (printBtn) {
            printBtn.addEventListener('click', function() {
                openPrintWindow();
            });
        }
    } catch (e) {}

    try {
        var printViewBtn = document.getElementById('agendaPublicPrintViewBtn');
        if (printViewBtn) {
            printViewBtn.addEventListener('click', function() {
                printCurrentView(calendar);
            });
        }
    } catch (e) {}
});
</script>
{% endblock %}
