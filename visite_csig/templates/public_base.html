<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda Ministre">
    <meta name="theme-color" content="#104480">
    {% load static %}
    <title>{% block title %}{{ page_title|default:"Prendre rendez-vous" }}{% endblock %} - {{ APP_NAME }}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}?v={{ APP_VERSION }}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}?v={{ APP_VERSION }}">
    <link rel="apple-touch-icon" href="{% static 'images/mena-etfp.png' %}?v={{ APP_VERSION }}">
    <link rel="apple-touch-startup-image" href="{% static 'images/mena-etfp.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #104480;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border-soft: rgba(15, 23, 42, 0.10);
            --text-1: #0f172a;
            --text-2: #475569;
            --shadow-sm: 0 6px 18px rgba(2, 6, 23, 0.06);
            --shadow-md: 0 10px 30px rgba(2, 6, 23, 0.10);
        }
        * { font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; }
        .public-shell { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
        .public-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 18px; }
        .public-header .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .public-header .logos { display: flex; align-items: center; gap: 10px; }
        .public-header .logo { width: 72px; height: 52px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(15, 23, 42, 0.08); }
        .public-header .logo img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.12); }
        .public-header .brand { text-align: left; }
        .public-header .brand-title { font-weight: 800; letter-spacing: -0.3px; margin: 0; color: var(--primary-blue); font-size: 18px; line-height: 1.1; }
        .public-header .brand-subtitle { margin: 2px 0 0; color: var(--text-2); font-size: 12px; }
        .public-header .right { text-align: right; color: var(--text-2); font-size: 12px; font-weight: 700; }
        .main-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 18px; }
        .page-title-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
        .page-title-bar h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--primary-blue); display: flex; align-items: center; gap: 10px; }
        .page-title-bar .subtitle { color: var(--text-2); font-size: 13px; margin-top: 2px; }
        .card-section { background: var(--surface); border-radius: 16px; overflow: hidden; margin-bottom: 24px; border: 1px solid var(--border-soft); }
        .card-section .card-header-custom { background: var(--surface-2); color: var(--text-1); padding: 18px 24px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-soft); }
        .card-section .card-body { padding: 24px; }
        .footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 18px; }

        .btn-primary-gradient { background: linear-gradient(135deg, #0d3a6e 0%, var(--primary-blue) 55%, #1565a8 100%); color: #fff; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: all 0.2s; }
        .btn-primary-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(16, 68, 128, 0.30); color: #fff; }
        .btn-outline-gradient { background: #fff; color: var(--primary-blue); border: 2px solid rgba(16, 68, 128, 0.55); padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: all 0.2s; }
        .btn-outline-gradient:hover { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff; }

        .btn, .btn-group .btn { border-radius: 12px; font-weight: 800; }
        .btn-outline-primary, .btn-outline-warning, .btn-outline-info, .btn-outline-danger, .btn-outline-secondary { border-width: 2px; }
        .btn.btn-primary, .btn.btn-info, .btn.btn-success, .btn.btn-warning, .btn.btn-danger { border: none; }
        .btn.btn-primary { background: linear-gradient(135deg, #0d3a6e 0%, var(--primary-blue) 55%, #1565a8 100%); }
        .btn.btn-success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .btn.btn-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #111827; }
        .btn.btn-info { background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%); color: #0b1220; }
        .btn.btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn:focus { box-shadow: 0 0 0 4px rgba(16, 68, 128, 0.16) !important; }

        .form-label { font-size: 13px; font-weight: 800; color: #64748b; }
        .form-control, .form-select {
            border-radius: 12px;
            border: 2px solid rgba(15, 23, 42, 0.10);
            padding: 12px 14px;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: rgba(16, 68, 128, 0.60);
            box-shadow: 0 0 0 4px rgba(16, 68, 128, 0.12);
        }
        textarea.form-control { min-height: 120px; }

        .badge { border-radius: 999px; padding: 8px 12px; font-weight: 800; letter-spacing: 0.2px; }
        .alert { border: 0; border-radius: 14px; box-shadow: var(--shadow-sm); }
        .alert-info { background: #e0f2fe; color: #0b1220; }
        .alert-success { background: #dcfce7; color: #052e16; }
        .alert-warning { background: #fef3c7; color: #0b1220; }
        .alert-danger { background: #fee2e2; color: #450a0a; }

        .table { margin-bottom: 0; }
        .table.table-bordered { border-color: rgba(15, 23, 42, 0.10); }
        .table.table-bordered > :not(caption) > * > * { border-color: rgba(15, 23, 42, 0.10); }
        .table th { background: #f8fafc; font-weight: 900; color: #0f2f57; }
        .table td { font-weight: 700; color: #0f172a; }

        .input-group .btn { padding-left: 14px; padding-right: 14px; }
        .input-group .form-control { border-top-right-radius: 0; border-bottom-right-radius: 0; }
        .input-group .btn { border-top-left-radius: 0; border-bottom-left-radius: 0; }

        @media (max-width: 768px) {
            .public-shell { padding: 8px 8px 32px; }
            .public-header { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
            .public-header .right { display: none; }
            .public-header .logo { width: 44px; height: 36px; }
            .public-header .brand-title { font-size: 14px; }
            .public-header .brand-subtitle { font-size: 11px; }
            .main-card { padding: 12px 8px; }
            .card-section .card-body { padding: 12px 8px; }
            .page-title-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
            .page-title-bar h2 { font-size: 16px; }
            .page-title-bar .actions { width: 100%; }
            .btn-primary-gradient, .btn-outline-gradient { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="public-shell">
        
        <div class="main-card">
            {% block content %}{% endblock %}
        </div>

        <div class="footer">
            © {{ APP_NAME }}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
